<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Museum Heist 拆分素材</title>
<style>body{margin:0;padding:24px;background:#112632;color:#e8dbbd;font:16px "Microsoft YaHei",sans-serif}h1{margin:0 0 12px}h2{margin:34px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#1b3440;border:1px solid #667d82;padding:12px}.checker{height:180px;display:grid;place-items:center;background-color:#c5c5c5;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.checker img{max-width:96%;max-height:165px;object-fit:contain;image-rendering:pixelated}.card a{display:block;margin-top:10px;color:#ebcf9d;text-decoration:none;word-break:break-all}</style></head>
<body><h1>Museum Heist 拆分素材</h1><p>棋盘格仅用于检查透明区域，不属于图片本身。点击文件名可打开原素材。</p><h2>静态背景</h2><div class="grid" id="background"></div><h2>人物、展柜与宝物 · 透明 PNG</h2><div class="grid" id="sprites"></div><h2>交互与姿势 UI · 透明 SVG</h2><div class="grid" id="ui"></div>
<script>
const groups={background:['museum-hall.png'],sprites:['thief-right.png','thief-up.png','thief-down.png','guard-right.png','guard-up.png','guard-down.png','case-vase.png','case-crown.png','case-cameo.png','case-necklace.png','treasure-painting.png'],ui:['vision-cone.svg','alarm-icon.svg','treasure-icon.svg','meter-frame.svg','meter-segment.svg','route-progress.svg','pose-panel.svg','camera-frame.svg','warning-banner.svg','progress-frame.svg','progress-fill.svg','pose-arms-out.svg','pose-right-hand.svg','pose-left-hand.svg','pose-cross-arms.svg','pose-tracking.svg','button-primary.svg','button-secondary.svg','camera-permission-icon.svg','lock-icon.svg','success-icon.svg','failure-icon.svg','pause-icon.svg','retry-icon.svg']};
for(const [folder,names] of Object.entries(groups)){const root=document.getElementById(folder);for(const name of names){const src=`${folder}/${name}`;const card=document.createElement('div');card.className='card';const checker=document.createElement('div');checker.className='checker';const im=document.createElement('img');im.src=src;im.alt=name;checker.append(im);const link=document.createElement('a');link.href=src;link.textContent=name;card.append(checker,link);root.append(card)}}
</script></body></html>
