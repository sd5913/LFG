<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>姿势扫描 UI 拆分预览</title>
<style>
body{margin:0;background:#10242f;color:#f0dfbe;font:16px "Microsoft YaHei",sans-serif}main{max-width:1672px;margin:18px auto;padding:0 12px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin:14px 0}.controls label{display:flex;gap:8px;align-items:center}.controls select{font:inherit;background:#1e3745;color:#f0dfbe;border:1px solid #a0b9ae;padding:5px}.controls a{color:#f0dfbe}.viewport{position:relative;width:100%;overflow:hidden}.screen{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:top left;background:url('scene-reference.png') 0 0/100% 100%}.screen img{position:absolute;image-rendering:pixelated}.dim{position:absolute;left:0;top:89px;width:1672px;height:852px;background:rgba(5,19,28,.66)}.txt{position:absolute;font-family:Consolas,"Microsoft YaHei",sans-serif;font-weight:800;line-height:1;white-space:nowrap;color:#f2dfbe;letter-spacing:1px}.small{font-size:30px}.medium{font-size:37px}.large{font-size:45px}.coral{color:#d58c7b}
</style></head><body><main><div class="viewport"><div class="screen" id="screen"><div class="dim"></div>
<img src="hud-strip.svg" style="left:0;top:0;width:1672px;height:89px"><img src="alarm-siren.svg" style="left:70px;top:6px;width:72px;height:65px"><div class="txt small" style="left:170px;top:13px">警戒</div><div class="txt small" style="left:170px;top:46px" id="alarmText">40%</div><img id="alarmBar" src="alarm-040.svg" style="left:246px;top:22px;width:250px;height:43px"><img src="route-track.svg" style="left:733px;top:18px;width:490px;height:52px"><img src="route-museum-icon.svg" style="left:744px;top:21px;width:48px;height:40px"><img src="route-player-marker.svg" style="left:947px;top:21px;width:48px;height:40px"><img src="treasure-frame-icon.svg" style="left:1314px;top:9px;width:65px;height:64px"><div class="txt small" style="left:1405px;top:20px">宝物距离</div><div class="txt large" style="left:1538px;top:14px">24 m</div>
<img src="warning-banner.svg" style="left:190px;top:131px;width:1290px;height:90px"><img src="warning-icon.svg" style="left:225px;top:143px;width:64px;height:64px"><div class="txt large" style="left:306px;top:150px">扫描灯靠近 · 伪装成雕像</div><div class="txt large" style="left:1305px;top:150px" id="countdown">05 秒</div>
<img src="target-panel.svg" style="left:213px;top:248px;width:578px;height:520px"><div class="txt small" style="left:261px;top:279px">目标动作 02 / 04</div><div class="txt large" style="left:263px;top:330px">展开双臂，保持不动</div><img src="target-pose-arms-out.svg" style="left:305px;top:399px;width:390px;height:325px">
<img src="tracking-panel.svg" style="left:814px;top:248px;width:644px;height:520px"><div class="txt small" style="left:868px;top:278px">你的姿势</div><img src="camera-window.svg" style="left:857px;top:327px;width:562px;height:298px"><img src="tracking-pose-arms-out.svg" style="left:981px;top:354px;width:320px;height:260px"><div class="txt medium" style="left:867px;top:640px">姿势正确，继续保持</div><img id="holdBar" src="hold-062.svg" style="left:855px;top:686px;width:475px;height:48px"><div class="txt medium" style="left:1349px;top:691px" id="holdText">62%</div>
<img src="footer-panel.svg" style="left:206px;top:790px;width:1260px;height:68px"><div class="txt small" style="left:247px;top:813px">成功：获得安全窗口</div><div class="txt small coral" style="left:1186px;top:813px">失败：警戒上升</div>
</div></div><div class="controls"><label>警戒条 <select id="alarmSelect"></select></label><label>姿势保持条 <select id="holdSelect"></select></label><label>倒计时 <select id="timeSelect"></select></label><a href="gallery.html">查看全部透明部件</a></div></main>
<script>
const viewport=document.querySelector('.viewport'),screen=document.querySelector('#screen');function fit(){const scale=viewport.clientWidth/1672;screen.style.transform=`scale(${scale})`;viewport.style.height=`${941*scale}px`}addEventListener('resize',fit);fit();
const alarm=[...Array(11)].map((_,i)=>i*10),hold=[...new Set([...alarm,62])].sort((a,b)=>a-b);
function choices(id,values,current){const el=document.querySelector(id);for(const n of values){const o=document.createElement('option');o.value=n;o.textContent=`${n}%`;el.append(o)}el.value=current;return el}
choices('#alarmSelect',alarm,40).addEventListener('change',e=>{const n=Number(e.target.value);document.querySelector('#alarmBar').src=`alarm-${String(n).padStart(3,'0')}.svg`;document.querySelector('#alarmText').textContent=`${n}%`});
choices('#holdSelect',hold,62).addEventListener('change',e=>{const n=Number(e.target.value);document.querySelector('#holdBar').src=`hold-${String(n).padStart(3,'0')}.svg`;document.querySelector('#holdText').textContent=`${n}%`});
const time=document.querySelector('#timeSelect');for(let n=0;n<=10;n++){const o=document.createElement('option');o.value=n;o.textContent=`${String(n).padStart(2,'0')} 秒`;time.append(o)}time.value=5;time.addEventListener('change',e=>document.querySelector('#countdown').textContent=`${String(e.target.value).padStart(2,'0')} 秒`);
</script></body></html>
