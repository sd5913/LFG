<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>姿势扫描透明 UI 部件</title><style>body{margin:0;padding:24px;background:#10242f;color:#f0dfbe;font:16px "Microsoft YaHei",sans-serif}h1{margin:0}h2{margin-top:32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{padding:10px;background:#1c3542;border:1px solid #728c91}.view{height:155px;display:grid;place-items:center;background-color:#bbb;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.view img{max-width:96%;max-height:145px;image-rendering:pixelated}.card a{display:block;margin-top:8px;color:#f0dfbe;word-break:break-all}</style></head><body><h1>姿势扫描 UI 拆分部件</h1><p>棋盘格只用于检查透明区域。所有部件都可单独加载。</p><h2>界面部件</h2><div class="grid" id="parts"></div><h2>警戒条进度</h2><div class="grid" id="alarm"></div><h2>姿势保持进度</h2><div class="grid" id="hold"></div><script>
const parts=['hud-strip.svg','alarm-siren.svg','route-track.svg','route-museum-icon.svg','route-player-marker.svg','route-line.svg','treasure-frame-icon.svg','warning-banner.svg','warning-icon.svg','target-panel.svg','target-pose-arms-out.svg','tracking-panel.svg','camera-window.svg','tracking-pose-arms-out.svg','footer-panel.svg'];
const alarm=[...Array(11)].map((_,i)=>`alarm-${String(i*10).padStart(3,'0')}.svg`),hold=[...new Set([...Array(11)].map((_,i)=>i*10).concat(62))].sort((a,b)=>a-b).map(n=>`hold-${String(n).padStart(3,'0')}.svg`);
for(const [id,names] of [['parts',parts],['alarm',alarm],['hold',hold]])for(const name of names){const card=document.createElement('div');card.className='card';const view=document.createElement('div');view.className='view';const image=document.createElement('img');image.src=name;image.alt=name;view.append(image);const link=document.createElement('a');link.href=name;link.textContent=name;card.append(view,link);document.getElementById(id).append(card)}
</script></body></html>
