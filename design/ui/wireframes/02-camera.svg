<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#eef1f2"/><rect x="20" y="18" width="1240" height="684" rx="14" fill="#ffffff" stroke="#dce4e6" stroke-width="2"/><rect x="20" y="18" width="1240" height="72" rx="14" fill="#f6f8f8" stroke="#dce4e6" stroke-width="2"/><text x="48" y="64" fill="#2f7775" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start">MUSEUM HEIST  /  页面线框</text><text x="1230" y="64" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="end">02 / 07</text><text x="48" y="129" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">摄像头授权与校准</text><text x="48" y="159" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">目的：确认镜头可用、上半身完整入镜，再进入游戏。</text><rect x="48" y="196" width="725" height="428" rx="10" fill="#f7f9f9" stroke="#9cabb0" stroke-width="2"/><text x="75" y="234" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" text-anchor="start">摄像头预览</text><rect x="92" y="255" width="637" height="323" rx="8" fill="#e9eeee" stroke="#9cabb0" stroke-width="2"/><rect x="245" y="279" width="327" height="280" rx="12" fill="none" stroke="#2f7775" stroke-width="3"/><text x="408" y="415" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle">上半身取景框</text><rect x="104" y="539" width="132" height="32" rx="16" fill="#ffffff" stroke="#2f7775" stroke-width="1.5"/><text x="170" y="561" fill="#2f7775" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" text-anchor="middle">● 已检测到</text><rect x="801" y="196" width="429" height="428" rx="8" fill="#ffffff" stroke="#9cabb0" stroke-width="2"/><text x="833" y="241" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">1  授权摄像头</text><text x="833" y="274" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start">浏览器会请求摄像头权限。</text><text x="833" y="324" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">2  调整位置与光线</text><text x="833" y="357" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start">让头、肩、双臂都进入取景框。</text><text x="833" y="407" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">3  试做一个姿势</text><text x="833" y="440" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start">举起右手，保持约 2 秒。</text><rect x="833" y="475" width="365" height="58" rx="8" fill="#2f7775" stroke="#2f7775" stroke-width="2"/><text x="1015.5" y="511" fill="#fff" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">开始试动作</text><text x="833" y="568" fill="#aa5d50" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start">如被拒绝：显示原因和“重试授权”</text><text x="48" y="665" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start">隐私提示：摄像头用于本地姿势判断；最终文案需与实际实现一致。</text></svg>