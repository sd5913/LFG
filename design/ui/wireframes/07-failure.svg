<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#eef1f2"/><rect x="20" y="18" width="1240" height="684" rx="14" fill="#ffffff" stroke="#dce4e6" stroke-width="2"/><rect x="20" y="18" width="1240" height="72" rx="14" fill="#f6f8f8" stroke="#dce4e6" stroke-width="2"/><text x="48" y="64" fill="#2f7775" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start">MUSEUM HEIST  /  页面线框</text><text x="1230" y="64" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="end">07 / 07</text><text x="48" y="129" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" text-anchor="start">失败页</text><text x="48" y="159" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start">目的：解释失败原因，并让玩家快速重试。</text><rect x="48" y="195" width="760" height="448" rx="10" fill="#f7f9f9" stroke="#9cabb0" stroke-width="2"/><rect x="174" y="253" width="510" height="314" rx="8" fill="#f6e9e6" stroke="#aa5d50" stroke-width="3"/><text x="429" y="416" fill="#aa5d50" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">警报灯 / 被发现的场景插画</text><rect x="838" y="195" width="392" height="448" rx="8" fill="#ffffff" stroke="#9cabb0" stroke-width="2"/><text x="1034" y="275" fill="#aa5d50" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="700" text-anchor="middle">潜入失败</text><text x="1034" y="329" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle">原因：警戒值已满</text><text x="1034" y="371" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">下次试着躲在展柜后，</text><text x="1034" y="399" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">等扫描灯离开再行动。</text><rect x="884" y="456" width="300" height="62" rx="8" fill="#2f7775" stroke="#2f7775" stroke-width="2"/><text x="1034" y="494" fill="#fff" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">重试</text><rect x="884" y="536" width="300" height="50" rx="8" fill="#ffffff" stroke="#9cabb0" stroke-width="2"/><text x="1034" y="568" fill="#24333a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">返回开始页</text><text x="48" y="678" fill="#687b82" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start">失败原因随情境替换：警戒值满 / 被持续锁定 / 开锁超时。</text></svg>