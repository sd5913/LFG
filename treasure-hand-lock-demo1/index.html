<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071829" />
  <title>LFG · 宝箱手势解锁</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="unlock-app" aria-label="宝箱手势解锁">
    <section class="unlock-stage" id="unlock-stage" aria-label="四步手势解锁界面">
      <img class="static-shell" src="./assets/unlock-ui-components/backgrounds/ui_static_shell.png" alt="" />
      <img class="open-shell" id="success-sequence" src="./assets/unlock-ui-components/backgrounds/ui_chest_open.png" alt="宝箱打开并发出金光" aria-hidden="true" />
      <div class="top-cards" id="top-cards" aria-label="解锁步骤"></div>
      <section class="feedback-panel" aria-label="实时手势识别反馈">
        <img class="feedback-preview" src="./assets/unlock-ui-components/backgrounds/ui_initial_uniform_preview.png" alt="" />
        <img class="feedback-detection" id="feedback-detection" src="./assets/unlock-ui-components/feedback/live_pinch_detection_overlay.png" alt="" />
        <img class="feedback-check" id="feedback-check" src="./assets/unlock-ui-components/feedback/recognition_check_green.png" alt="" />
        <div class="feedback-copy" aria-live="polite"><span id="feedback-kicker">识别待机</span><strong id="gesture-name">等待开启扫描</strong><small id="feedback-detail">点击上方按钮开始本地手势识别</small></div>
      </section>
      <section class="dial" aria-label="解锁转盘">
        <img class="dial-rotor" id="dial-rotor" src="./assets/unlock-ui-components/dial/dial_rotor.png" alt="解锁转盘" />
        <img class="dial-hub" src="./assets/unlock-ui-components/dial/dial_hub_keyhole.png" alt="钥匙孔" />
        <img class="dial-pointer" src="./assets/unlock-ui-components/dial/dial_pointer.png" alt="" />
      </section>
      <section class="instruction-panel" aria-label="当前目标手势">
        <img class="target-icon" id="target-icon" src="./assets/unlock-ui-components/instruction-icons/gesture_index_gold.png" alt="食指手势" />
        <img class="target-rotate" id="target-rotate" src="./assets/unlock-ui-components/feedback/target_pinch_and_rotate.png" alt="捏合并旋转" />
        <img class="rotation-arrow" id="rotation-arrow" src="./assets/unlock-ui-components/feedback/rotation_arrow_clockwise.png" alt="顺时针旋转" />
        <div class="instruction-copy"><span>当前目标</span><strong id="instruction-title">伸出食指</strong><small id="instruction-detail">其余手指握起并保持</small></div>
      </section>
      <section class="progress-track" aria-label="解锁进度"><div class="progress-fill-mask"><img id="progress-fill" src="./assets/unlock-ui-components/progress/progress_fill_gold.png" alt="" /></div><div class="progress-nodes" id="progress-nodes"></div></section>
      <div class="stage-controls"><button class="scan-toggle" id="scan-toggle" type="button">开启手势扫描</button><button class="reset-toggle" id="reset-btn" type="button">重置</button><span class="scan-status" id="scan-status" role="status">摄像头未开启</span></div>
      <div class="unlock-message" id="unlock-message" role="status" aria-live="polite"></div>
      <video id="webcam" class="sensor-video" autoplay muted playsinline aria-hidden="true"></video>
    </section>
    <p class="privacy-note">手势仅在本机浏览器中分析；界面不会显示、录制或上传摄像头画面。</p>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
