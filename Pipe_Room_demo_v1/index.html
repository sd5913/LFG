<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081527">
<title>LFG · Museum Heist / Pipe Room 01</title><link rel="stylesheet" href="styles.css">
</head><body>
<div class="game-frame" id="game-frame">
<canvas id="game" width="1671" height="941" role="img" aria-label="包含底层、中层和顶层管道的博物馆地下关卡" data-en-aria-label="Underground museum level with three pipe decks"></canvas>
<p class="pipe-controls-hint"><span><kbd>WASD / ↑↓←→</kbd> <span data-en="Move and climb">移动和爬梯</span></span><span><kbd>Space</kbd> <span data-en="Jump or dodge">跳跃或闪避</span></span><span><kbd>E</kbd> <span data-en="Open valve">打开阀门</span></span></p>
<div class="mobile-control" aria-label="屏幕操作按钮" data-en-aria-label="On-screen controls"><button data-key="ArrowLeft" aria-label="向左" data-en-aria-label="Left">←</button><button data-key="ArrowUp" aria-label="向上" data-en-aria-label="Up">↑</button><button data-key="ArrowDown" aria-label="向下" data-en-aria-label="Down">↓</button><button data-key="ArrowRight" aria-label="向右" data-en-aria-label="Right">→</button><button data-key="Space" data-en="Jump">跳跃</button><button data-key="KeyE" data-en="Valve">阀门</button></div>
<div class="result" id="pipe-caught" role="alert" hidden>
  <section class="result-card">
    <h2 data-en="You were caught">小偷被抓到了</h2>
    <p data-en="Alert 100%">警戒 100%</p>
    <button id="retry-pipe" class="btn primary" data-en="Restart">重新开始</button>
  </section>
</div>
</div>
<div class="result" id="load-error" role="alert" hidden><div class="result-card"><h2 data-en="Could not load the pipe room">管道场景加载失败</h2><p id="load-error-detail"></p><button id="reload-room" class="btn primary" data-en="Reload">重新加载</button></div></div>
<div class="modal-backdrop" id="valve-modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
<div class="modal-header"><div><small data-en="SECURITY MECHANISM / INTERACTIVE VALVE">安防机关 / 分流阀</small><h2 id="modal-heading" data-en="Diversion valve · Gesture unlock">分流阀门 · 手势开闸</h2></div><button id="close-modal" class="x-btn" aria-label="关闭" data-en-aria-label="Close">×</button></div>
<div class="modal-body"><div class="camera-view"><video id="valve-video" autoplay playsinline muted></video><canvas id="hand-overlay" width="640" height="480"></canvas><div class="camera-empty" id="camera-empty">◉<strong data-en="HAND CAMERA OFFLINE">摄像头未开启</strong><span data-en="Use the camera for gesture detection, or use the keyboard simulation.">先用摄像头识别真实手势，或者使用下方明确标记的键盘测试方式</span></div><span class="camera-tag" id="gesture-tag" data-en="NO HAND INPUT">等待手势</span></div>
<div class="valve-how"><p class="modal-step" id="gesture-step" data-en="01 · GRIP THE HANDLE">01 · 握住手柄</p><div class="gesture-picture"><div class="hand-emoji" id="gesture-picture">✊</div><div><b id="gesture-name" data-en="Step 1: Make a fist">第一步：握拳</b><span id="gesture-instruction" data-en="Hold a fist for about half a second to grip the valve handle.">对着摄像头握拳并保持约半秒，模拟抓住阀门手柄。</span></div></div><div class="gesture-track"><span id="gesture-meter"></span></div><p id="gesture-status" class="gesture-status" data-en="Waiting to start…">等待开始…</p><button id="camera-start" class="btn primary" data-en="◉ Enable gesture detection">◉ 开启真实手势识别</button><button id="camera-stop" class="btn outline" data-en="Stop camera">停止摄像头</button></div></div>
<div class="modal-bottom"><div><b data-en="Keyboard simulation">键盘测试</b><small data-en="Hold Enter for 1.2 seconds to simulate opening the valve.">按住 Enter 1.2 秒模拟开启阀门。</small></div><div class="demo-meter"><i id="demo-meter-fill"></i></div><button class="btn outline" id="cancel-valve" data-en="Back to the tunnels">返回关卡</button></div>
</section></div>
<script type="module" src="src/game.js"></script>
</body></html>
