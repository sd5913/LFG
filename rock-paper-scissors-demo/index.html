<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-en="Guard chase · Rock, paper, scissors">保安追击 · 石头剪刀布</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game" aria-label="保安追击石头剪刀布" data-en-aria-label="Guard chase: Rock, paper, scissors">
  <div class="room" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="scoreboard" aria-label="三回合比分" data-en-aria-label="Three-round score"><span id="round-label" data-en="Round 1 / 3">第 1 / 3 回合</span><div id="round-marks"><b>1</b><b>2</b><b>3</b></div><strong id="score" data-en="You 0 : 0 Guard">你 0 : 0 保安</strong></div>
  <header><span class="eyebrow">MUSEUM HEIST</span></header>
  <section class="arena">
    <div class="fighter police"><div class="portrait"><img src="assets/guard-avatar.png" alt="保安" data-en-alt="Guard"></div><strong data-en="Guard">保安</strong><div class="choice" id="police-choice"></div></div>
    <div class="center"><div class="count" id="count" data-en="Ready">准备</div><img class="vs" src="assets/rps-vs.png" alt="VS"><p id="phase"></p></div>
    <div class="fighter thief"><div class="portrait"><img src="assets/thief-avatar.png" alt="玩家" data-en-alt="Player"></div><strong data-en="You">你</strong><div class="choice" id="player-choice"></div></div>
  </section>
  <section class="bottom">
    <div class="gesture-panel"><div class="hands"><div data-gesture="rock"><img src="assets/police-rock.png" alt="石头" data-en-alt="Rock"><span data-en="Rock">石头</span></div><div data-gesture="paper"><img src="assets/police-paper.png" alt="布" data-en-alt="Paper"><span data-en="Paper">布</span></div><div data-gesture="scissors"><img src="assets/police-scissors.png" alt="剪刀" data-en-alt="Scissors"><span data-en="Scissors">剪刀</span></div></div></div>
    <div class="scan-panel"><div class="scan-head"><span id="camera-status" data-en="Camera off">摄像头未启动</span></div><div class="preview"><video id="camera" playsinline muted autoplay></video><canvas id="landmarks" width="640" height="480"></canvas><div class="camera-cover" id="camera-cover" data-en="Keep one whole hand in view">请露出一只完整的手</div></div><p id="detected" data-en="Waiting for a gesture">等待识别</p></div>
  </section>
  <footer><div class="result" id="result" role="status" data-en="Start when ready">准备好后开始挑战</div><div class="buttons"><button id="start" hidden data-en="Enable camera and start">启动摄像头并开始</button><button id="demo" hidden data-en="Camera-free demo">无摄像头演示</button><button id="retry" hidden data-en="Next round">下一回合</button></div></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
