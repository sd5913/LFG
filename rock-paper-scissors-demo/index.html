<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>保安追击 · 石头剪刀布</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game" aria-label="保安追击石头剪刀布">
  <div class="room" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="scoreboard" aria-label="三回合比分"><span id="round-label">第 1 / 3 回合</span><div id="round-marks"><b>1</b><b>2</b><b>3</b></div><strong id="score">你 0 : 0 保安</strong></div>
  <header><span class="eyebrow">MUSEUM HEIST</span></header>
  <section class="arena">
    <div class="fighter police"><div class="portrait"><img src="assets/guard-avatar.png" alt="保安"></div><strong>保安</strong><div class="choice" id="police-choice"></div></div>
    <div class="center"><div class="count" id="count">准备</div><img class="vs" src="assets/rps-vs.png" alt="VS"><p id="phase"></p></div>
    <div class="fighter thief"><div class="portrait"><img src="assets/thief-avatar.png" alt="玩家"></div><strong>你</strong><div class="choice" id="player-choice"></div></div>
  </section>
  <section class="bottom">
    <div class="gesture-panel"><div class="hands"><div data-gesture="rock"><img src="assets/police-rock.png" alt="石头"><span>石头</span></div><div data-gesture="paper"><img src="assets/police-paper.png" alt="布"><span>布</span></div><div data-gesture="scissors"><img src="assets/police-scissors.png" alt="剪刀"><span>剪刀</span></div></div></div>
    <div class="scan-panel"><div class="scan-head"><span id="camera-status">摄像头未启动</span></div><div class="preview"><video id="camera" playsinline muted autoplay></video><canvas id="landmarks" width="640" height="480"></canvas><div class="camera-cover" id="camera-cover">请露出一只完整的手</div></div><p id="detected">等待识别</p></div>
  </section>
  <footer><div class="result" id="result" role="status">准备好后开始挑战</div><div class="buttons"><button id="start" hidden>启动摄像头并开始</button><button id="demo" hidden>无摄像头演示</button><button id="retry" hidden>下一回合</button></div></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
